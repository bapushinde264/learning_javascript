<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = 10;
        var b = 4;
        var c = a-b; //binary

        document.write(c + "<br>");
        c++;
        c++;
        c++;
        c--;
        c++;
        c--;
        c++;  //17 //9
        document.write(c);
    </script>
      
      <!-- Assignment Operator -->
    <script>
        var x = 10;
        var y = 12;
        x += y;
        document.write(x + "<br>"); //22
        document.write(y); //12
    </script>
</body>
</html>
