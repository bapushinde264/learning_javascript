```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5 border border-2 p-3">

            <h3 class="text-center mt-2 mb-3">Contact Us</h3>

            <form onsubmit="return validate()">

                <!-- Name -->
                <div class="mb-2">
                    <label for="name" class="form-label">Name:</label>

                    <input type="text"
                           id="name"
                           name="name"
                           class="form-control"
                           placeholder="Your name">

                    <span class="text-danger" id="nameError"></span>
                </div>


                <!-- Email -->
                <div class="mb-2">
                    <label for="email" class="form-label">Email:</label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           placeholder="Your email">

                    <span class="text-danger" id="emailError"></span>
                </div>


                <!-- Mobile Number -->
                <div class="mb-2">
                    <label for="mobile" class="form-label">
                        Mobile Number:
                    </label>

                    <input type="tel"
                           id="mobile"
                           name="mobile"
                           class="form-control"
                           placeholder="Your mobile number">

                    <span class="text-danger" id="mobileError"></span>
                </div>


                <!-- Password -->
                <div class="mb-2">
                    <label for="password" class="form-label">
                        Password:
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter password">

                    <span class="text-danger" id="passwordError"></span>
                </div>


                <!-- Confirm Password -->
                <div class="mb-2">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password:
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           class="form-control"
                           placeholder="Confirm password">

                    <span class="text-danger"
                          id="confirmPasswordError"></span>
                </div>


                <!-- Message -->
                <div class="mb-2">
                    <label for="message" class="form-label">
                        Message:
                    </label>

                    <textarea id="message"
                              name="message"
                              class="form-control"
                              rows="3"
                              placeholder="Your message"></textarea>

                    <span class="text-danger" id="messageError"></span>
                </div>


                <!-- Gender -->
                <div class="mb-2">

                    <label class="form-label d-block">
                        Gender:
                    </label>

                    <div class="form-check form-check-inline">

                        <input class="form-check-input"
                               type="radio"
                               name="gender"
                               id="male"
                               value="male">

                        <label class="form-check-label" for="male">
                            Male
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input class="form-check-input"
                               type="radio"
                               name="gender"
                               id="female"
                               value="female">

                        <label class="form-check-label" for="female">
                            Female
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input class="form-check-input"
                               type="radio"
                               name="gender"
                               id="other"
                               value="other">

                        <label class="form-check-label" for="other">
                            Other
                        </label>

                    </div>

                    <br>

                    <span class="text-danger" id="genderError"></span>

                </div>


                <!-- Terms -->
                <div class="form-check mb-2">

                    <input class="form-check-input"
                           type="checkbox"
                           id="agree"
                           name="agree">

                    <label class="form-check-label" for="agree">
                        I agree to the terms & conditions
                    </label>

                    <br>

                    <span class="text-danger" id="agreeError"></span>

                </div>


                <!-- Submit -->
                <button type="submit"
                        class="btn btn-primary w-100">
                    Submit
                </button>

            </form>

        </div>

    </div>
</div>


<script>

function validate() {

    // Get form values
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const password = document.getElementById("password").value.trim();
    const confirmPassword =
        document.getElementById("confirmPassword").value.trim();
    const message = document.getElementById("message").value.trim();

    const gender =
        document.querySelector('input[name="gender"]:checked');

    const agree =
        document.getElementById("agree").checked;


    // Error spans
    const nameError = document.getElementById("nameError");
    const emailError = document.getElementById("emailError");
    const mobileError = document.getElementById("mobileError");
    const passwordError = document.getElementById("passwordError");
    const confirmPasswordError =
        document.getElementById("confirmPasswordError");
    const messageError = document.getElementById("messageError");
    const genderError = document.getElementById("genderError");
    const agreeError = document.getElementById("agreeError");


    // Clear previous errors
    nameError.textContent = "";
    emailError.textContent = "";
    mobileError.textContent = "";
    passwordError.textContent = "";
    confirmPasswordError.textContent = "";
    messageError.textContent = "";
    genderError.textContent = "";
    agreeError.textContent = "";


    // Validation flag
    let isValid = true;


    // ---------------- NAME VALIDATION ----------------

    if (name === "") {

        nameError.textContent = "Please enter your name";
        isValid = false;

    } else if (name.length < 3) {

        nameError.textContent =
            "Please enter at least 3 characters";

        isValid = false;
    }


    // ---------------- EMAIL VALIDATION ----------------

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "") {

        emailError.textContent =
            "Please enter your email";

        isValid = false;

    } else if (!emailPattern.test(email)) {

        emailError.textContent =
            "Please enter a valid email";

        isValid = false;
    }


    // ---------------- MOBILE VALIDATION ----------------

    const mobilePattern = /^[0-9]{10}$/;

    if (mobile === "") {

        mobileError.textContent =
            "Please enter your mobile number";

        isValid = false;

    } else if (!mobilePattern.test(mobile)) {

        mobileError.textContent =
            "Please enter a valid 10 digit mobile number";

        isValid = false;
    }


    // ---------------- PASSWORD VALIDATION ----------------

    /*
        Password conditions:

        1. Minimum 8 characters
        2. At least one lowercase letter
        3. At least one uppercase letter
        4. At least one number
        5. At least one special character
    */

    const passwordPattern =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;


    if (password === "") {

        passwordError.textContent =
            "Please enter your password";

        isValid = false;

    } else if (!passwordPattern.test(password)) {

        passwordError.textContent =
            "Password must be at least 8 characters and include uppercase, lowercase, number and special character";

        isValid = false;
    }


    // ---------------- CONFIRM PASSWORD ----------------

    if (confirmPassword === "") {

        confirmPasswordError.textContent =
            "Please confirm your password";

        isValid = false;

    } else if (confirmPassword !== password) {

        confirmPasswordError.textContent =
            "Password does not match";

        isValid = false;
    }


    // ---------------- MESSAGE VALIDATION ----------------

    if (message === "") {

        messageError.textContent =
            "Please enter your message";

        isValid = false;
    }


    // ---------------- GENDER VALIDATION ----------------

    if (!gender) {

        genderError.textContent =
            "Please select your gender";

        isValid = false;
    }


    // ---------------- TERMS VALIDATION ----------------

    if (!agree) {

        agreeError.textContent =
            "You must agree to the Terms & Conditions";

        isValid = false;
    }


    // ---------------- FINAL RESULT ----------------

    if (isValid) {

        alert("Form submitted successfully");

    }

    return isValid;
}

</script>

</body>
</html>
