<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <h2 class="text-center mb-4">Contact Us</h2>

                <form id="contactForm" onsubmit="return validate()">

                    <!-- Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            Name:
                        </label>

                        <input type="text" class="form-control" id="name" name="name" placeholder="Your name">
                        <span class="text-danger" id="nameError"></span>
                    </div>


                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email:
                        </label>

                        <input type="email" class="form-control" id="email" name="email" placeholder="Your email">
                        <span class="text-danger" id="emailError"></span>
                    </div>


                    <!-- Mobile Number -->
                    <div class="mb-3">
                        <label for="mobile" class="form-label">
                            Mobile Number:
                        </label>

                        <input type="tel" class="form-control" id="mobile" name="mobile"
                            placeholder="Your mobile number">
                        <span class="text-danger" id="mobileError"></span>
                    </div>


                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password:
                        </label>

                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter password">
                        <span class="text-danger" id="passwordError"></span>
                    </div>


                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password:
                        </label>

                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                            placeholder="Confirm password"> <span class="text-danger" id="confirmPasswordError"></span>
                    </div>


                    <!-- Message -->
                    <div class="mb-3">
                        <label for="message" class="form-label">
                            Message:
                        </label>

                        <textarea class="form-control" id="message" name="message" rows="4"
                            placeholder="Your message"></textarea>
                        <span class="text-danger" id="messageError"></span>
                    </div>


                    <!-- Gender -->
                    <div class="mb-3">
                        <label class="form-label d-block">Gender:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                            <label class="form-check-label" for="male">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                            <label class="form-check-label" for="female">Female</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="other" value="other">
                            <label class="form-check-label" for="other">Other</label>
                        </div>
                        <span class="text-danger" id="genderError"></span>
                    </div>



                    <!-- Terms & Conditions -->
                    <div class="mb-3">

                        <div class="form-check">

                            <input class="form-check-input" type="checkbox" id="agree" name="agree">

                            <label class="form-check-label" for="agree">
                                I agree to the terms & conditions
                            </label>
                            <span class="text-danger" id="agreeError"></span>

                        </div>

                    </div>


                    <!-- Submit Button -->
                    <div class="text-center">

                        <button type="submit" class="btn btn-primary">
                            Submit
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function validate() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const password = document.getElementById("password").value.trim();
            const confirmPassword = document.getElementById("confirmPassword").value.trim();
            const message = document.getElementById("message").value.trim();
            const gender = document.querySelector('input[name="gender"]:checked');
            const genderValue = gender ? gender.value : "";
            const agree = document.getElementById("agree").checked;

            // Error spans
            const nameError = document.getElementById("nameError");
            const emailError = document.getElementById("emailError");
            const mobileError = document.getElementById("mobileError");
            const passwordError = document.getElementById("passwordError");
            const confirmPasswordError = document.getElementById("confirmPasswordError");
            const messageError = document.getElementById("messageError");
            const genderError = document.getElementById("genderError");
            const agreeError = document.getElementById("agreeError");

            // Reset errors
            nameError.textContent = "";
            emailError.textContent = "";
            mobileError.textContent = "";
            passwordError.textContent = "";
            confirmPasswordError.textContent = "";
            messageError.textContent = "";
            genderError.textContent = "";
            agreeError.textContent = "";

            let isValid = true;

            if (name === "") {
                nameError.textContent = "Please enter your name.";
                isValid = false;
            } else if (name.length < 3) {
                nameError.textContent = "Name must be at least 3 characters.";
                isValid = false;
            }

            if (email === "") {
                emailError.textContent = "Please enter your email.";
                isValid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
                emailError.textContent = "Please enter a valid email address.";
                isValid = false;
            }

            if (mobile === "") {
                mobileError.textContent = "Please enter a mobile number.";
                isValid = false;
            } else if (!/^\d{10}$/.test(mobile)) {
                mobileError.textContent = "Please enter a valid 10-digit mobile number.";
                isValid = false;
            }

            const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@.#$!%*?&])[A-Za-z\d@.#$!%*?&]{8,15}$/;
            if (password === "") {
                passwordError.textContent = "Please enter a password.";
                isValid = false;
            } else if (!passwordPattern.test(password)) {
                passwordError.textContent = "Password must be 8–15 characters, include uppercase, lowercase, number & special character.";
                isValid = false;
            }

            if (confirmPassword === "") {
                confirmPasswordError.textContent = "Please confirm your password.";
                isValid = false;
            } else if (confirmPassword !== password) {
                confirmPasswordError.textContent = "Passwords do not match.";
                isValid = false;
            }

            if (message === "") {
                messageError.textContent = "Please enter a message.";
                isValid = false;
            }

            if (!genderValue) {
                genderError.textContent = "Please select a gender.";
                isValid = false;
            }

            if (!agree) {
                agreeError.textContent = "You must agree to the terms.";
                isValid = false;
            }

           
            if (isValid) {
                alert("form submitted succesfully");
            }
           return isValid;
        }

    </script>

</body>

</html>
