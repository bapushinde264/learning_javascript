<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container ">
    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5 border border-2 solid">

            <h3 class="text-center mt-3 mb-3">Contact Us</h3>

            <form onsubmit="return validate()">

                <!-- Name -->
                <div class="mb-2">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text"
                           id="name"
                           name="name"
                           class="form-control"
                           placeholder="Your name">
                           <span class="text-danger" id="nameError"></span>
                </div>

                <!-- Email -->
                <div class="mb-2">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           placeholder="Your email">
                           <span class="text-danger" id="emailError"></span>
                           
                </div>

                <!-- Mobile Number -->
                <div class="mb-2">
                    <label for="mobile" class="form-label">Mobile Number:</label>
                    <input type="tel"
                           id="mobile"
                           name="mobile"
                           class="form-control"
                           placeholder="Your mobile number">
                           <span class="text-danger" id="mobileError"></span>
                </div>

                <!-- Password -->
                <div class="mb-2">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password"
                           name="password"
                           id="password"
                           class="form-control"
                           placeholder="Enter password">
                           <span class="text-danger" id="passwordError"></span>
                </div>

                <!-- Confirm Password -->
                <div class="mb-2">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password:
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           class="form-control"
                           placeholder="Confirm password">
                           <span class="text-danger" id="confirmPasswordError"></span>
                </div>

                <!-- Message -->
                <div class="mb-2">
                    <label for="message" class="form-label">Message:</label>

                    <textarea id="message"
                    name="message"
                              class="form-control"
                              rows="3"
                              placeholder="Your message"></textarea>
                              <span class="text-danger" id="messageError"></span>
                </div>

                <!-- Gender -->
                <div class="mb-2">
                    <label class="form-label d-block">Gender:</label>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input"
                               type="radio"
                               name="gender"
                               id="male"
                               value="male">

                        <label class="form-check-label" for="male">
                            Male
                        </label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input"
                               type="radio"
                               name="gender"
                               id="female"
                               value="female">

                        <label class="form-check-label" for="female">
                            Female
                        </label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input"
                               type="radio"
                               name="gender"
                               id="other"
                               value="other">

                        <label class="form-check-label" for="other">
                            Other
                        </label>
                    </div>
                    <span class="text-danger" id="genderError"></span>
                </div>

                <!-- Terms -->
                <div class="form-check mb-2">
                    <input class="form-check-input"
                           type="checkbox"
                           id="agree"
                           name="agree"
                           id="terms">

                    <label class="form-check-label" for="terms">
                        I agree to the terms & conditions
                    </label>
                    <span class="text-danger" id="agreeError"></span>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary w-100">
                    Submit
                </button>

            </form>

        </div>

    </div>
</div>

</body>
</html>
